[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Terminals"]
dependencies = [
    "matplotlib>=3.11.2,<3.12",
    "pandas>=3.0.6,<3.1",
    "scipy>=1.18.1,<1.19",
    "lmfit>=1.3.4,<1.4",
    "pathvalidate>=3.3.1,<3.4",
    "numpy>=2.5.3,<2.6",
    "pyusb>=1.3.1,<1.4",
    "matplotlib-sixel-backend @ git+https://github.com/jpkline/matplotlib-sixel-backend.git@3c979d0c3a3f6944f59dcdbf08f83842113bfb25",
]
name = "qd_spec"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[project.urls]
"Bug Tracker" = "https://github.com/jpkline/qd_spec/issues"
"Homepage" = "https://github.com/jpkline/qd_spec"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.setuptools]
package-dir = { "" = "src" }

[project.scripts]
qd-spec = "qd_spec.cli:main"
qd_spec = "qd_spec.cli:main"
